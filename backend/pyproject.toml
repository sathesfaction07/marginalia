[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "policy-assist"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "boto3>=1.34",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
chromadb = ["chromadb>=0.5", "sentence-transformers>=3.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

line-length = 100
[tool.ruff.lint]
# The portfolio-standard rule set. Absent here, so this project linted against ruff's bare
# defaults while its CI still ran `ruff check` -- which is how findings accumulated unseen.
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
[tool.hatch.build.targets.wheel]
packages = ["src/policy_assist"]

[tool.ruff.lint.per-file-ignores]
# llm.py holds the system prompt; the other two log long f-strings.
"src/policy_assist/llm.py" = ["E501"]
"src/policy_assist/app.py" = ["E501"]
"src/policy_assist/retrieval/bedrock_kb.py" = ["E501"]
